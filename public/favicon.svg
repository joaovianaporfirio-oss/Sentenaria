<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E253B" />
      <stop offset="100%" stop-color="#141929" />
    </linearGradient>
    <filter id="paperShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#090C15" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- 3D Duolingo/Paper Mario Tactile Base Lip & Outer Rim -->
  <rect x="6" y="13" width="116" height="110" rx="29" fill="#0F1422" />
  <rect x="6" y="6" width="116" height="108" rx="29" fill="#0F1422" />
  <rect x="9" y="9" width="110" height="102" rx="26" fill="#FFFFFF" />
  <rect x="14" y="14" width="100" height="92" rx="21" fill="url(#boardBg)" />

  <!-- Subtle 3x3 Grid Cells (Representing Sentenaria's 9x9 Board & Central 3x3 Sanctuary) -->
  <!-- Row 1 -->
  <rect x="20" y="20" width="26" height="24" rx="6" fill="#27304C" />
  <rect x="51" y="20" width="26" height="24" rx="6" fill="#232B44" />
  <rect x="82" y="20" width="26" height="24" rx="6" fill="#27304C" />

  <!-- Row 2 (With Golden Highlighted Center Sanctuary at (51, 50)) -->
  <rect x="20" y="50" width="26" height="24" rx="6" fill="#232B44" />
  <rect x="50" y="49" width="28" height="26" rx="7" fill="#3B3526" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="4 2" />
  <rect x="82" y="50" width="26" height="24" rx="6" fill="#232B44" />

  <!-- Row 3 -->
  <rect x="20" y="80" width="26" height="24" rx="6" fill="#27304C" />
  <rect x="51" y="80" width="26" height="24" rx="6" fill="#232B44" />
  <rect x="82" y="80" width="26" height="24" rx="6" fill="#27304C" />

  <!-- Blue Player Paper Cutout Tokens (Top-Right & Bottom-Left) -->
  <g filter="url(#paperShadow)">
    <circle cx="95" cy="32" r="11.5" fill="#FFFFFF" />
    <circle cx="95" cy="32" r="8" fill="#1CB0F6" />
    <circle cx="95" cy="32" r="3.2" fill="#FFFFFF" />

    <circle cx="33" cy="92" r="11.5" fill="#FFFFFF" />
    <circle cx="33" cy="92" r="8" fill="#1CB0F6" />
    <circle cx="33" cy="92" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- Diagonal Trinca Connection Beam (Top-Left -> Center -> Bottom-Right) -->
  <g filter="url(#paperShadow)">
    <!-- Paper Sticker White Outline for Trinca Beam -->
    <line x1="33" y1="32" x2="95" y2="92" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    <!-- Nodes White Sticker Rim -->
    <circle cx="33" cy="32" r="13" fill="#FFFFFF" />
    <circle cx="64" cy="62" r="14" fill="#FFFFFF" />
    <circle cx="95" cy="92" r="13" fill="#FFFFFF" />

    <!-- Coral Red Trinca Beam & Tokens -->
    <line x1="33" y1="32" x2="95" y2="92" stroke="#FF4B4B" stroke-width="10" stroke-linecap="round" />
    <circle cx="33" cy="32" r="9" fill="#FF4B4B" />
    <circle cx="64" cy="62" r="10" fill="#FF4B4B" />
    <circle cx="95" cy="92" r="9" fill="#FF4B4B" />

    <!-- Crisp Center Sparkle / Star inside the Trinca Pivot -->
    <circle cx="33" cy="32" r="3.5" fill="#FFFFFF" />
    <path d="M64 55 L66.2 59.8 L71 62 L66.2 64.2 L64 69 L61.8 64.2 L57 62 L61.8 59.8 Z" fill="#FDE047" />
    <circle cx="95" cy="92" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
